[project]
name = "yunex-demo"
version = "0.1.0"
description = "Short description of the project."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "minio>=7.2.20",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "streamlit>=1.66.1",
]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pre-commit>=4.7.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yunex_demo"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/yunex_demo/demo_1/*" = ["E501"]  # long UI help strings

[tool.mypy]
strict = true
files = ["src", "tests"]
# demo_1 is untyped and uses flat script imports; type-check it once it is annotated
exclude = ["demo_1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=yunex_demo --cov-report=term-missing"
