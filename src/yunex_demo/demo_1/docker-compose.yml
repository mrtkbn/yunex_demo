services:
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"        # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001"    # web console (login from .env)
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:?set MINIO_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?set MINIO_PASSWORD in .env}
    volumes:
      - minio_data:/data
    networks:
      - fx_net   # Airflow reaches MinIO as minio:9000 on this network

volumes:
  minio_data:

# Shared with the Airflow (Astro) containers; create it once with `make network`
networks:
  fx_net:
    external: true
    name: fx_net
